name: tapete

services:
  # api.tapete.solucoesdigitais.io
  tapete-api:
    build:
      context: ..
      dockerfile: apps/api/Dockerfile
    container_name: tapete-api
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@tapete-db:5432/${POSTGRES_DB}
    volumes:
      - ../config:/app/config:ro
      - ./keys:/app/keys:ro
    depends_on:
      tapete-db:
        condition: service_healthy
    networks:
      - interna
      - proxy

  # tapete.solucoesdigitais.io (site em / e painel em /admin)
  tapete-web:
    build:
      context: ..
      dockerfile: apps/site/Dockerfile
      args:
        API_PUBLIC_URL: ${API_PUBLIC_URL}
        WHATSAPP_NUMERO: ${WHATSAPP_NUMERO:-}
    container_name: tapete-web
    restart: unless-stopped
    networks:
      - proxy

  tapete-db:
    image: postgres:16-alpine
    container_name: tapete-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - tapete-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - interna

volumes:
  tapete-db-data:

networks:
  interna:
  proxy:
    external: true
    name: ${PROXY_NETWORK}
