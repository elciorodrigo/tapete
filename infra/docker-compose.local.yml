# Só para rodar no computador: publica as portas e aponta o site para a API local.
# docker compose -f docker-compose.yml -f docker-compose.local.yml up -d --build
services:
  tapete-api:
    ports:
      - "127.0.0.1:3000:3000"
    environment:
      WEB_ORIGINS: http://localhost:8080
      COOKIE_SECURE: "false"

  tapete-web:
    ports:
      - "127.0.0.1:8080:8000"

networks:
  nginx-proxy_default:
    external: false
    name: tapete_local_proxy
